<div class="flex flex-col gap-6">
  <app-title main="Lista de Tarefas" subtitle="Exemplo de lista de tarefas Angular"></app-title>
<div>
  <input type="text" placeholder="Adicionar nova tarefa" class="input w-full"
  (keyup.enter)="adicionarTarefa($event)"
  />
</div>

  <div class="flex flex-col gap-2">
    @for (item of tarefaService.items(); track item.id)
    {
      <div class="p-4 border border-zinc-800 rounded-lg flex items-center gap-4">
        <span [class.line-through]="item.completed" class="flex-1">{{item.title}}</span>
        <span
          [class.bg-green-700]="item.completed"
          [class.bg-yellow-700]="!item.completed"
          class="px-4 py-1 rounded-full text-sm">{{item.completed ? 'Concluído' : 'Pendente'}}
      </span>
      <div>
        <button (click)="tarefaService.toggle(item.id)"
        [class.bg-zinc-700]="item.completed"
        [class.bg-green-700]="!item.completed"
        class="btn btn-secondary mr-2">
          <mat-icon>
            {{item.completed ? 'undo': 'check_circle'}}
          </mat-icon>
        </button>
        <button (click)="tarefaService.remove(item.id)" class="btn btn-danger">
          <mat-icon>
            delete
          </mat-icon>
        </button>
      </div>
      </div>
    }
  </div>
</div>
